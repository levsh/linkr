[project]
name = "linkr"
version = "0.5.0"
description = "Async messaging framework with RPC, task and event delivery modes"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
keywords = ["rpc", "task", "event", "pubsub", "async", "framework", "rabbitmq", "amqp", "middleware"]
authors = [
    { name = "Roman Koshel", email = "roma.koshel@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
rabbitmq = ["aio-pika>=9.0"]
docs = ["zensical"]

[project.urls]
Homepage = "https://github.com/levsh/linkr"
Repository = "https://github.com/levsh/linkr"
BugTracker = "https://github.com/levsh/linkr/issues"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.test.dependencies]
docker = "*"
mypy = "*"
pylint = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
ruff = "*"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
zensical = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
indent = 4
src_paths = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services like Docker",
]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "broad-exception-caught",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-lines",
    "too-many-locals",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-branches",
    "unused-argument",
]

[tool.pylint.format]
max-line-length = 120

